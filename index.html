<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Riff — Recorrido virtual 360</title>

<!-- ============================================================
  RECORRIDO VIRTUAL 360 — RIFF (versión GitHub Pages, alta calidad)
  Motor: Pannellum 2.5.6

  FOTOS:
    Van en la carpeta /fotos del propio repositorio, con nombre
    01.jpg ... 21.jpg (11.jpg = nevera abierta). Así no pasan por
    WordPress y no se recomprimen ni se recortan a 2560 px.
    Tamaño recomendado: 8192 x 4096 px, JPG calidad 85.

  ICONOS:
    Siguen enlazados a bottaromarketing.com. Si prefieres que el
    repo sea 100% independiente, sube avanzar.png, abrir.png e
    info.png a /iconos y cambia las tres rutas de ICON_*.

  MAPA DE CONEXIONES:
    01 <-> 02 <-> 03 <-> 04 <-> 05 <-> 06 <-> 07 <-> 08 <-> 09
    09 <-> 10 <-> 11               (10=nevera cerrada, 11=abierta)
    10 <-> 12 <-> 13 <-> 14 <-> 15 <-> 16
    09 <-> 17
    17 <-> 18 <-> 19 <-> 20 <-> 21 <-> 17
============================================================= -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1b24; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  :root {
    --rf-ink: #0d1b24;
    --rf-accent: #6ee7c9;
    --rf-cream: #f4f1ea;
  }

  /* El visor ocupa toda la ventana: ideal para incrustarlo con iframe */
  #rf-panorama { position: fixed; inset: 0; width: 100%; height: 100%; }

  .pnlm-tooltip { font-family: system-ui, sans-serif; }
  .pnlm-hotspot-base { background: none !important; }

  /* Título de la escena actual */
  #rf-scene-title {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(13, 27, 36, 0.78); color: var(--rf-cream);
    padding: 6px 14px; border-radius: 999px; font-size: 0.85rem;
    border: 1px solid rgba(110, 231, 201, 0.35);
    z-index: 5; pointer-events: none; white-space: nowrap;
    transition: opacity 0.3s ease;
  }
  #rf-scene-title b { color: var(--rf-accent); font-weight: 600; margin-right: 6px; }

  /* Iconos de hotspot */
  .rf-hotspot { width: 65px; height: 48px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; }
  .rf-hotspot .rf-hotspot-icon {
    width: 58px; height: auto;
    filter: drop-shadow(0 0 7px rgba(110, 231, 201, 0.9)) drop-shadow(0 0 2px rgba(13, 27, 36, 0.7));
    transition: transform 0.15s ease;
    animation: rf-pulse 2.2s ease-in-out infinite;
  }
  .rf-hotspot:hover .rf-hotspot-icon { transform: scale(1.15); }
  @keyframes rf-pulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }

  .rf-hotspot-label {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    background: var(--rf-ink); color: var(--rf-cream); padding: 3px 10px;
    border-radius: 6px; font-size: 0.75rem; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
  }
  .rf-hotspot:hover .rf-hotspot-label { opacity: 1; }

  /* Panel de información de los cuadros */
  #rf-info-panel {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 480px;
    background: rgba(13, 27, 36, 0.95); border: 1px solid rgba(110, 231, 201, 0.4);
    border-radius: 10px; padding: 16px 18px; color: var(--rf-cream);
    font-size: 0.9rem; line-height: 1.4; display: none; z-index: 10;
  }
  #rf-info-panel.rf-visible { display: block; }
  #rf-info-panel a { color: var(--rf-accent); }
  #rf-info-panel-title { color: var(--rf-accent); font-weight: 600; margin: 0 0 6px; font-size: 0.95rem; }
  #rf-info-panel-close { position: absolute; top: 8px; right: 10px; background: none; border: none;
    color: var(--rf-cream); font-size: 1.1rem; cursor: pointer; line-height: 1; }
</style>
</head>
<body>

</div>

    function foto(n) { return "fotos/" + n + ".jpg"; }

    // Panel de información

    var infoPanelTitle = document.getElementById("rf-info-panel-title");
    var infoPanelText = document.getElementById("rf-info-panel-text");
    document.getElementById("rf-info-panel-close").addEventListener("click", function () {
      infoPanel.classList.remove("rf-visible");
    });

    function openInfoPanel(title, text) {
      infoPanelTitle.textContent = title;
      // Convierte las URLs del texto en enlaces clicables
      infoPanelText.innerHTML = "";
      text.split(/(https?:\/\/\S+)/).forEach(function (part) {
        if (/^https?:\/\//.test(part)) {
          var a = document.createElement("a");
          a.href = part; a.textContent = part.replace(/^https?:\/\//, "").replace(/\/$/, "");
          a.target = "_blank"; a.rel = "noopener";
          infoPanelText.appendChild(a);
        } else {
          infoPanelText.appendChild(document.createTextNode(part));
        }
      });
      infoPanel.classList.add("rf-visible");
    }

    function renderIconHotspot(hotSpotDiv, args) {
      hotSpotDiv.classList.add("rf-hotspot");
      var iconSrc = ICON_AVANZAR;
      if (args.kind === "abrir") iconSrc = ICON_ABRIR;
      if (args.kind === "info") iconSrc = ICON_INFO;
      hotSpotDiv.innerHTML =
        '<img class="rf-hotspot-icon" src="' + iconSrc + '" style="transform: rotate(' +
        (args.bearing || 0) + 'deg);" alt="" />' +
        '<span class="rf-hotspot-label">' + args.label + "</span>";
      if (args.kind === "info") {
        hotSpotDiv.addEventListener("click", function () {
          openInfoPanel(args.label, args.text || "");
        });
      }
    }

    // -----------------------------------------------------------
    // Precarga de las escenas vecinas: mientras miras una escena,
    // el navegador va descargando las fotos a las que puedes saltar,
    // así el cambio es casi instantáneo aunque las fotos pesen más.
    // -----------------------------------------------------------
    var precargadas = {};
    function precargarVecinas(sceneId) {
      (scenes[sceneId].hotSpots || []).forEach(function (h) {
        if (h.type !== "scene" || precargadas[h.sceneId]) return;
        precargadas[h.sceneId] = true;
        var img = new Image();
        img.src = scenes[h.sceneId].panorama;
      });
    }

    var sceneName = document.getElementById("rf-scene-name");
    function alCambiarEscena() {
      var id = viewer.getScene();
      sceneName.textContent = scenes[id].title;
      infoPanel.classList.remove("rf-visible");
      precargarVecinas(id);
    }
    viewer.on("load", alCambiarEscena);
  })();

</html>
